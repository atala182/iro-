<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İrem, seni çok seviyorum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,300;1,9..144,600&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#fff1ee; --bg2:#ffd9df; --bg3:#f3c6e6;
  --ink:#5b1230; --soft:#9c4a67; --accent:#e0245e; --card:rgba(255,255,255,.55);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#1d0a17; --bg2:#34102a; --bg3:#4a1740;
    --ink:#ffe3ec; --soft:#f3a9c3; --accent:#ff5c8a; --card:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  --bg1:#1d0a17; --bg2:#34102a; --bg3:#4a1740;
  --ink:#ffe3ec; --soft:#f3a9c3; --accent:#ff5c8a; --card:rgba(255,255,255,.07);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
  background-attachment:fixed;
  color:var(--ink);
  font-family:"Nunito",system-ui,sans-serif;
  overflow-x:hidden;
}
#hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.h{position:absolute;bottom:-40px;color:var(--accent);opacity:.0;animation:rise linear infinite}
@keyframes rise{
  0%{transform:translateY(0) translateX(0) scale(.6);opacity:0}
  10%{opacity:.5}
  100%{transform:translateY(-115vh) translateX(var(--dx)) scale(1.1);opacity:0}
}
.w{position:absolute;font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;color:var(--soft);opacity:0;white-space:nowrap;
  animation:float var(--dur,12s) ease-in-out forwards}
.w.a{color:var(--accent);font-weight:600}
@keyframes float{
  0%{opacity:0;transform:translate(0,0) rotate(var(--r)) scale(.8)}
  20%{opacity:.5}
  80%{opacity:.5}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(calc(var(--r) * -1)) scale(1.1)}
}
.stage{position:relative;z-index:1}
section{
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:48px 24px;
}
h1,h2{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;margin:0;line-height:1.1}
h1{font-size:clamp(2.6rem,10vw,6rem)}
h2{font-size:clamp(1.8rem,6vw,3.2rem)}
p{max-width:34ch;font-size:1.15rem;line-height:1.6;color:var(--soft);margin:18px 0 0}
.name{color:var(--accent);font-weight:600}

/* opening: the one orchestrated moment */
.word{display:inline-block;opacity:0;transform:translateY(30px) rotate(-3deg);filter:blur(8px);
  animation:in 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes in{to{opacity:1;transform:none;filter:blur(0)}}
.beat{width:84px;height:84px;margin-bottom:28px;animation:beat 1.6s ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}70%{transform:scale(1)}}
.hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom,0px));font-size:.9rem;color:var(--soft);animation:nudge 2s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(8px)}}

/* scroll transitions */
.reveal{opacity:0;transform:translateY(40px) scale(.97);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.reveal.on{opacity:1;transform:none}
.reveal.left{transform:translateX(-60px)}
.reveal.right{transform:translateX(60px)}
.reveal.left.on,.reveal.right.on{transform:none}
.reveal.d1{transition-delay:.15s}.reveal.d2{transition-delay:.3s}

.reasons{display:grid;gap:14px;width:min(520px,100%);margin-top:28px}
.reason{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(224,36,94,.18);border-radius:18px;padding:18px 20px;font-size:1.1rem;text-align:left}

.big{font-size:clamp(4rem,18vw,9rem);color:var(--accent);line-height:1;transition:transform .3s}
button{
  margin-top:28px;font:inherit;font-weight:600;color:#fff;background:var(--accent);
  border:0;border-radius:999px;padding:14px 32px;cursor:pointer;
  transition:transform .2s,box-shadow .2s;box-shadow:0 8px 24px rgba(224,36,94,.35)
}
button:hover{transform:translateY(-2px) scale(1.03)}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.msg{min-height:2.4em;margin-top:22px;font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1.5rem;color:var(--ink)}


.reply{width:min(460px,100%);margin-top:34px;display:flex;flex-direction:column;gap:12px}
.reply[hidden]{display:none}
.reply label{font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:1.3rem}
.reply textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid rgba(224,36,94,.25);border-radius:16px;padding:14px 16px;resize:vertical;min-height:96px}
.reply textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.reply button{align-self:center;margin-top:0}
.reply button:disabled{opacity:.6;cursor:default}
.sent{color:var(--accent);min-height:1.4em}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .word,.reveal{opacity:1;transform:none;filter:none}
  .h,.w{display:none}
}
</style>
</head>
<body>
<div id="hearts" aria-hidden="true"></div>
<main class="stage">

<section>
  <svg class="beat" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--accent)" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.6 4.5 6.3 4.5c2.1 0 3.9 1.1 5.7 3.3 1.8-2.2 3.6-3.3 5.7-3.3 3.7 0 5.4 3.9 3.9 7.3C19.500 16.400 12 21 12 21z"/></svg>
  <h1 id="title"></h1>
  <p style="animation:in 1s 2.6s both">Bu sayfa sadece senin için.</p>
  <div class="hint">aşağı kaydır ↓</div>
</section>

<section>
  <h2 class="reveal left">Seni tanıdığımdan beri</h2>
  <p class="reveal right d1">Günler daha yumuşak, sesler daha güzel, her şey biraz daha anlamlı.</p>
</section>

<section>
  <h2 class="reveal">Seni neden seviyorum?</h2>
  <div class="reasons">
    <div class="reason reveal left">Yanındayken zaman hızlanıyor.</div>
    <div class="reason reveal right d1">Gülüşün her şeyi düzeltiyor.</div>
    <div class="reason reveal left d2">Sen olduğun için.</div>
  </div>
</section>

<section>
  <div class="big reveal" id="big">♥</div>
  <h2 class="reveal d1">İrem, seni çok seviyorum.</h2>
  <button class="reveal d2" id="btn" type="button">Kalbime dokun</button>
  <div class="msg" id="msg" aria-live="polite"></div>
  <form class="reply reveal d2" id="reply" hidden>
    <label for="txt">Bana bir şey söylemek ister misin?</label>
    <textarea id="txt" maxlength="500" required placeholder="Buraya yaz…"></textarea>
    <button type="submit" id="send">Gönder</button>
    <div class="sent" id="sent" aria-live="polite"></div>
  </form>
</section>

</main>
<script src="config.js"></script>
<script>
(function(){
  // title: word by word entrance
  var words = ["İrem,","seni","çok","seviyorum"];
  var t = document.getElementById("title");
  words.forEach(function(w,i){
    var s = document.createElement("span");
    s.className = "word" + (i===0 ? " name" : "");
    s.style.animationDelay = (0.3 + i*0.45) + "s";
    s.textContent = w + (i<words.length-1 ? "\u00a0" : "");
    t.appendChild(s);
  });

  // floating hearts
  var box = document.getElementById("hearts");
  function heart(){
    var h = document.createElement("span");
    h.className = "h";
    h.textContent = "♥";
    h.style.left = Math.random()*100 + "%";
    h.style.fontSize = (12 + Math.random()*22) + "px";
    h.style.setProperty("--dx", (Math.random()*80-40) + "px");
    h.style.animationDuration = (7 + Math.random()*7) + "s";
    box.appendChild(h);
    setTimeout(function(){ h.remove(); }, 15000);
  }
  for (var i=0;i<8;i++) setTimeout(heart, i*400);
  setInterval(heart, 900);

    // süzülen yazılar: kaan, kalp, irem
  var wl = ["kaan","kalp","irem","irem ♥","kaan & irem","kalp","♥"];
  function word(){
    if (box.childElementCount > 70) return;
    var w = document.createElement("span");
    var d = 10 + Math.random()*8;
    w.className = "w" + (Math.random() < .4 ? " a" : "");
    w.textContent = wl[Math.floor(Math.random()*wl.length)];
    w.style.left = (Math.random()*92) + "%";
    w.style.top = (Math.random()*95) + "%";
    w.style.fontSize = (16 + Math.random()*30) + "px";
    w.style.setProperty("--dx", (Math.random()*240-120) + "px");
    w.style.setProperty("--dy", (-60 - Math.random()*120) + "px");
    w.style.setProperty("--r", (Math.random()*30-15) + "deg");
    w.style.setProperty("--dur", d + "s");
    box.appendChild(w);
    setTimeout(function(){ w.remove(); }, d*1000 + 200);
  }
  for (var j=0;j<16;j++) setTimeout(word, j*250);
  setInterval(word, 600);

  // scroll reveals
  var els = document.querySelectorAll(".reveal");
  if ("IntersectionObserver" in window){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(e.isIntersecting){ e.target.classList.add("on"); }
        else { e.target.classList.remove("on"); }
      });
    },{threshold:.35});
    els.forEach(function(el){ io.observe(el); });
  } else {
    els.forEach(function(el){ el.classList.add("on"); });
  }

  // button: burst of hearts + message
  var lines = ["Seni çok seviyorum.","İyi ki varsın.","Kalbim hep sende.","Sen benim en güzel şansımsın."];
  var n = 0;
  document.getElementById("btn").addEventListener("click", function(){
    document.getElementById("msg").textContent = lines[n++ % lines.length];
    var big = document.getElementById("big");
    big.style.transform = "scale(1.25)";
    setTimeout(function(){ big.style.transform = ""; }, 300);
    for (var i=0;i<14;i++) setTimeout(heart, i*60);
  });
  // Supabase: İrem'in cevabını kaydet (yalnızca ekleme izni var)
  var cfg = window.SITE_CONFIG || {};
  var form = document.getElementById("reply");
  if (cfg.supabaseUrl && cfg.supabaseKey) { form.hidden = false; }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var txt = document.getElementById("txt"), send = document.getElementById("send"), out = document.getElementById("sent");
    var text = txt.value.trim();
    if (!text) return;
    send.disabled = true;
    fetch(cfg.supabaseUrl + "/rest/v1/replies", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": cfg.supabaseKey,
        "Authorization": "Bearer " + cfg.supabaseKey,
        "Prefer": "return=minimal"
      },
      body: JSON.stringify({ message: text })
    }).then(function(r){
      if (!r.ok) throw new Error(r.status);
      txt.value = "";
      out.textContent = "Mesajın bana ulaştı ♥";
    }).catch(function(){
      out.textContent = "Gönderilemedi, birazdan tekrar dene.";
    }).then(function(){ send.disabled = false; });
  });
})();
</script>
</body>
</html>
